# Long fuzz runs: every night (and on demand) each fuzz target runs for
# 5 minutes; the CI workflow runs them for 10 seconds on every push. The
# corpus is cached between runs, and a failing input is uploaded as an
# artifact.
name: fuzz
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    name: Fuzz targets (5 minutes each)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - id: cache-dir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: fuzz-go-${{ github.run_id }}
          restore-keys: fuzz-go-
      - run: make fuzz FUZZTIME=5m
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
