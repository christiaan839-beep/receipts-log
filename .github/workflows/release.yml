# Publishes a release from a vX.Y.Z tag on a commit on main: runs the CI
# workflow, builds reproducible binaries for Linux and macOS (amd64 and
# arm64) with a SHA256SUMS file, builds and pushes a multi-platform image
# to ghcr.io with an SBOM, attests the build provenance of every binary and
# of the image, and, after a maintainer approves the protected "release"
# environment, creates the GitHub release. RELEASING.md has the steps.
#
# Actions are pinned to full commit SHAs (the tag each SHA had when pinned
# is in the comment). Every job starts with no token permissions and asks
# only for what it uses.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/christiaan839-beep/receipts-log
jobs:
  plan:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read main's history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is vX.Y.Z on a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::the tagged commit is not on main"; exit 1; }

  test:
    name: Test
    needs: plan
    # "./" rather than GitHub's "$/" self-repository syntax, which resolves
    # to the same commit here: Scorecard (v5.5.0) and actionlint (1.7.12)
    # do not parse "$/" and report it as an unpinned third-party workflow.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # check out the code to test

  binaries:
    name: Build the binaries
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Build, archive and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist"; mkdir -p "$out"
          epoch=$(git log -1 --format=%ct)
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="receipts-log_${TAG#v}_${os}_${arch}"
            stage="$RUNNER_TEMP/stage/$name"; mkdir -p "$stage"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -buildid= -X main.version=$TAG" \
              -o "$stage/receipts-log" ./cmd/receipts-log
            cp LICENSE README.md "$stage/"
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
              -C "$RUNNER_TEMP/stage" -cf - "$name" | gzip -n > "$out/$name.tar.gz"
          done
          (cd "$out" && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS)
          cat "$out/SHA256SUMS"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS
      - name: Keep the attestation bundle next to the binaries
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/dist/attestation.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  image:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read # check out the code
      packages: write # push the image to ghcr.io
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on GitHub and in the registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create the GitHub release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's section of CHANGELOG.md; without one, GitHub's
        # generated notes.
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > "$notes"
          args=(--verify-tag --title "$TAG")
          if [ -s "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$TAG" "${args[@]}" dist/*
