# Format, vet, staticcheck, race-enabled tests, short fuzz runs, a container
# build, and the cross-implementation tests against verifiable-receipts.
# Actions are pinned to full commit SHAs (resolved with `git ls-remote`);
# the token is read-only.
name: ci
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read # check out the code
# Keyed on the calling workflow too, so a tag push's own run never cancels
# the run that release.yml makes; only pull request runs are superseded.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.26", "1.27"] # the go.mod minimum and the two supported releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: make fmt-check
      - run: make vet
      # Staticcheck 2026.2.1 reads Go 1.26's export data, not 1.27.2's
      # (2026.2.2 does; it passes the 14-day cooldown on 26 October 2026).
      - if: matrix.go == '1.26'
        run: make staticcheck
      - run: make race
      - if: matrix.go == '1.27'
        run: make fuzz FUZZTIME=10s
      - run: make build

  interop:
    name: Interop with verifiable-receipts
    runs-on: ubuntu-latest
    env:
      # The verifiable-receipts commit the cross-checks run against.
      VR_REF: 732fce9d4d050a0acdaa2c004a08f57af4c5ec5c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: christiaan839-beep/verifiable-receipts
          ref: ${{ env.VR_REF }}
          path: verifiable-receipts
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography==50.0.1"
      - run: make interop VERIFIABLE_RECEIPTS_DIR="$GITHUB_WORKSPACE/verifiable-receipts"

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t receipts-log:ci .
      - name: Image runs as non-root
        run: test "$(docker inspect --format '{{.Config.User}}' receipts-log:ci)" = "65532:65532"
      - run: docker run --rm receipts-log:ci version
